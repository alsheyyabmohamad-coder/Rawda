<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>سوق الأصحاب</title>

<style>

body{
font-family: Arial;
background:#f2f2f2;
text-align:center;
}

h1{
margin:30px;
}

.container{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:25px;
padding:30px;
}

.card{
background:white;
padding:15px;
border-radius:10px;
box-shadow:0 0 10px rgba(0,0,0,0.2);
transition:0.3s;
cursor:pointer;
}

.card:hover{
transform:scale(1.05);
}

.card img{
width:100%;
height:200px;
object-fit:cover;
border-radius:8px;
}

button{
margin-top:10px;
padding:8px 15px;
border:none;
background:#4CAF50;
color:white;
border-radius:5px;
cursor:pointer;
}

</style>
</head>

<body>

<h1>😂 سوق الأصحاب</h1>

<div class="container">
