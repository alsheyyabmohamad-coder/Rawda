<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>المواصفات</title>

<style>

body{
font-family:Arial;
background:#f2f2f2;
text-align:center;
padding:40px;
}

.profile{
background:white;
padding:30px;
border-radius:10px;
width:350px;
margin:auto;
box-shadow:0 0 10px rgba(0,0,0,0.2);
}

img{
width:100%;
border-radius:10px;
}

button{
margin-top:20px;
padding:10px 20px;
border:none;
background:#333;
color:white;
border-radius:6px;
cursor:pointer;
}

</style>
</head>

<body>

<div class="profile">

<img id="image">

<h2 id="name"></h2>

<p id="age"></p>
<p id="skill"></p>
<p id="price"></p>

<button onclick="goBack()">رجوع</button>

</div>

<script>

const data={

person1:{
name:"صاحب 1",
age:"العمر: 17",
skill:"المهارة: لاعب فيفا محترف",
price:"السعر: شاورما"
},

person2:{
name:"صاحب 2",
age:"العمر: 18",
skill:"المهارة: نايم طول اليوم",
price:"السعر: برجر"
},

person3:{
name:"صاحب 3",
age:"العمر: 17",
skill:"المهارة: يضحك بدون سبب",
price:"السعر: بيتزا"
}

}

let person=localStorage.getItem("selectedPerson")

document.getElementById("name").innerText=data[person].name
document.getElementById("age").innerText=data[person].age
document.getElementById("skill").innerText=data[person].skill
document.getElementById("price").innerText=data[person].price

document.getElementById("image").src="images/"+person+".jpg"

function goBack(){
window.location="index.html"
}

</script>

</body>
</html>
